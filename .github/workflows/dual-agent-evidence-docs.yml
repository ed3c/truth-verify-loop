name: Dual-Agent evidence docs convergence

on:
  pull_request:
    paths:
      - "harness/dual_agent_evidence/README.md"
      - "harness/dual_agent_evidence/AGENTS.md"
      - "harness/dual_agent_evidence/stack-index.json"
      - "tests/test_dual_agent_evidence_docs.py"
      - "tests/test_dual_agent_evidence_docs_history.py"
      - ".github/workflows/dual-agent-evidence-docs.yml"
      - "harness/dual_agent_evidence/matrix-preflight.json"
      - "harness/dual_agent_evidence/convergence.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  truth-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate Stack index JSON
        run: python -m json.tool harness/dual_agent_evidence/stack-index.json >/dev/null
      - name: Re-run complete deterministic truth matrix
        run: |
          python -m unittest \
            tests.test_dual_agent_evidence_contract \
            tests.test_dual_agent_evidence_delivery \
            tests.test_dual_agent_evidence_effect \
            tests.test_dual_agent_evidence_artifact \
            tests.test_dual_agent_evidence_user_result \
            tests.test_dual_agent_evidence_matrix
      - name: Run Agent/read-route traceability controls
        run: |
          python -m unittest \
            tests.test_dual_agent_evidence_docs \
            tests.test_dual_agent_evidence_docs_history
      - name: Run repository verification
        run: bash verify.sh
