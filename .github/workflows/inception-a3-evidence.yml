name: Inception A3 exact-evidence preflight

on:
  push:
    branches:
      - agent/inception-a3-exact-evidence
  pull_request:
    paths:
      - docs/architecture/inception-exact-evidence/**
      - schemas/inception-code-evidence.v1.schema.json
      - schemas/inception-citation-claim.v1.schema.json
      - harness/inception_evidence.py
      - tests/test_inception_evidence.py
      - examples/inception-evidence/**
      - .github/workflows/inception-a3-evidence.yml

permissions:
  contents: read

jobs:
  deterministic-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact workflow subject
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate exact A3 preparation manifest and lease
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import pathlib
          import re
          import subprocess

          root = pathlib.Path.cwd()
          manifest_path = root / "docs/architecture/inception-exact-evidence/preflight.json"
          readme_path = root / "docs/architecture/inception-exact-evidence/README.md"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          readme = readme_path.read_text(encoding="utf-8")

          expected = {
              "schema_version": "inception-owner-preflight/v1",
              "atom_id": "INCEPTION-A3",
              "stage": "OWNER_IMPLEMENTATION_PREPARATION",
              "state": "READY_FOR_FIRST_IMPLEMENTATION_COMMIT",
              "repository": "ed3c/truth-verify-loop",
              "branch": "agent/inception-a3-exact-evidence",
          }
          for key, value in expected.items():
              assert manifest.get(key) == value, f"DRIFT:{key}:{manifest.get(key)!r}"

          base = manifest["base_subject"]
          assert base == {
              "commit": "ce0c90f0c9bc87427d433ce537eea7f3a0fca008",
              "tree": "9ab841a793c4cdbca82a5a31eddb2dcd7485f3c1",
          }, "BASE_SUBJECT_DRIFT"
          controller = manifest["controller_subject"]
          assert controller["commit"] == "6e0a916fd06dd8635d77c9a8c4d1b475185ea13e"
          assert controller["tree"] == "c3851a6953d456d0342a9776eed28561c1af0ca1"
          assert controller["packet_digest"] == "sha256:8ed7553094f26df439f796e25ef83cdbe6916d0c50e8e659905ca12d3bd44ad6"
          assert controller["bundle_digest"] == "sha256:dc4473b3195a738e55eb49c43661b6e1f4ea7f95c66749454776f2003b18ebc3"

          for key in (
              "state_machine",
              "existing_mechanisms",
              "writable_paths",
              "conditional_paths",
              "read_only_paths",
              "resource_leases",
              "required_evidence_lanes",
              "positive_controls",
              "mutation_controls",
              "forbidden_actions",
              "claims_not_proven",
          ):
              values = manifest.get(key)
              assert isinstance(values, list) and values, f"EMPTY_OR_MISSING:{key}"
              if all(isinstance(item, str) for item in values):
                  assert len(values) == len(set(values)), f"DUPLICATE:{key}"

          assert not (set(manifest["writable_paths"]) & set(manifest["read_only_paths"])), "LEASE_OVERLAP"
          assert manifest["cleanup_contract"]["required"] is True
          assert manifest["cleanup_contract"]["rollback_subject"] == base["commit"]
          assert manifest["next_transition"] == "ADD_STRICT_CODE_AND_CITATION_SCHEMAS_AND_FIRST_HOLLOW_CONTROL"
          assert "OWNER IMPLEMENTATION PREPARATION ONLY" in readme
          assert "lexical match is not entailment" in readme
          assert "cannot become the proposer" in readme

          changed = subprocess.check_output(
              ["git", "diff", "--name-only", f"{base['commit']}...HEAD"],
              text=True,
          ).splitlines()
          allowed = {
              "docs/architecture/inception-exact-evidence/README.md",
              "docs/architecture/inception-exact-evidence/preflight.json",
              ".github/workflows/inception-a3-evidence.yml",
          }
          unexpected = sorted(set(changed) - allowed)
          assert not unexpected, f"PATH_LEASE_VIOLATION:{unexpected}"

          combined = readme + "\n" + json.dumps(manifest, ensure_ascii=False)
          for forbidden in ("/Users/", "/home/", "/mnt/data/", "gemini.google.com", "BEGIN PRIVATE KEY"):
              assert forbidden not in combined, f"PRIVATE_LOCATOR_OR_SECRET:{forbidden}"
          assert not re.search(r"(?i)(api[_-]?key|password|private[_-]?key)\s*[:=]\s*['\"][^'\"]+", combined)

          print(
              "PASS atom=INCEPTION-A3 state=READY_FOR_FIRST_IMPLEMENTATION_COMMIT "
              f"changed={len(changed)} mutations={len(manifest['mutation_controls'])}"
          )
          PY

      - name: Check textual patch hygiene
        run: git diff --check
