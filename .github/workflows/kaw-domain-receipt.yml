name: KAW Domain Receipt

on:
  pull_request:
    paths:
      - 'harness/kaw_receipt.py'
      - 'receipts/kaw/**'
      - 'tests/test_kaw_receipt.py'
      - '.github/workflows/kaw-domain-receipt.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-synthetic-receipt:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Rebuild, validate, and mutate the exact receipt
        run: python3 -m unittest discover -s tests -p 'test_kaw_receipt.py' -v
      - name: Upload public domain receipt
        uses: actions/upload-artifact@v4
        with:
          name: tvl-kaw-public-domain-receipt
          path: receipts/kaw/public-claim-canary.json
          if-no-files-found: error
          retention-days: 30
